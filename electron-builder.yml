appId: build.jinsu.sourcenote
productName: Sourcenote
copyright: Copyright © 2026 Park Jinsu
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
  # Main loads only the legacy pdf.js build; the renderer bundles its own copy.
  - "!node_modules/pdfjs-dist/{build,web,types,image_decoders}/**"
# ffmpeg is spawned as a process, so its binary must live outside app.asar.
# @napi-rs/canvas (used to render slide images) is a native .node module.
asarUnpack:
  - node_modules/ffmpeg-static/**
  - node_modules/@napi-rs/**
extraResources:
  - from: samples/notes
    to: samples/notes
mac:
  # macOS decodes audio with the system afconvert. The ffmpeg-static macOS
  # binary is built with --enable-nonfree and may not be redistributed.
  files:
    - "!node_modules/ffmpeg-static/ffmpeg"
  target:
    - target: dmg
      arch: arm64
  category: public.app-category.education
  hardenedRuntime: true
  # Signed when a "Developer ID Application" identity is in the keychain;
  # notarized when APPLE_KEYCHAIN_PROFILE names a notarytool profile.
dmg:
  artifactName: Sourcenote-${version}-mac-${arch}.dmg
  sign: true
win:
  target:
    - target: nsis
      arch: x64
nsis:
  artifactName: Sourcenote-${version}-win-${arch}-setup.exe
  oneClick: false
  allowToChangeInstallationDirectory: true
